name: publish to PyPI

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.10.9'
          python-version: '3.12'
      - run: uv sync --locked --group dev --extra image
      - name: Check release tag and package version
        run: |
          uv run --no-sync python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          import ray360
          project = tomllib.loads(Path('pyproject.toml').read_text())['project']
          version = project['version']
          if project['name'] != 'ray360' or ray360.__version__ != version:
              raise SystemExit('Package name or version does not match the source')
          if os.environ['GITHUB_REF_NAME'] != f'v{version}':
              raise SystemExit('Release tag must match the package version')
          PY
      - run: uv run --no-sync python -m pytest
      - run: uv build --no-sources
      - run: uv tool run --from twine==7.0.0 twine check --strict dist/*
      - run: uv run --no-sync python scripts/check_wheel.py
      - run: uv run --no-sync python scripts/check_wheel.py --image
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ray360/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.10.9'
          enable-cache: false
      - run: uv publish --trusted-publishing always dist/*
