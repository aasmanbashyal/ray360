[package]
name = "ray360-native"
version = "0.3.0"
edition = "2021"
rust-version = "1.79"
license = "MIT"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
numpy = "0.27.1"
pyo3 = { version = "0.27.1", features = ["extension-module"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
