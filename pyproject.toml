[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "ray360"
version = "0.1.0"
description = "Perspective views, cubemap crosses, and seam-aware annotation mapping for stitched 360 panoramas"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Aasman Bashyal"}]
dependencies = ["numpy>=1.24"]
classifiers = ["Programming Language :: Python :: 3", "Development Status :: 3 - Alpha", "Topic :: Scientific/Engineering :: Image Processing"]

[project.urls]
Repository = "https://github.com/aasmanbashyal/ray360"
Documentation = "https://github.com/aasmanbashyal/ray360/blob/main/docs/api.md"
Issues = "https://github.com/aasmanbashyal/ray360/issues"

[project.optional-dependencies]
image = ["Pillow>=10"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9", "mypy>=1.15"]

[tool.uv]
default-groups = []

[tool.hatch.build.targets.wheel]
packages = ["src/ray360"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/examples", "/benchmarks", "/scripts", "/.github", "/README.md", "/CONTRIBUTING.md", "/SECURITY.md", "/LICENSE", "/pyproject.toml", "/uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
files = ["src/ray360"]
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
